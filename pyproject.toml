[project]
name = "walking-yt"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.12.13"
dependencies = [
    "accelerate>=1.14.0",
    "bitsandbytes>=0.50.0",
    "google-api-python-client>=2.197.0",
    "langdetect>=1.0.9",
    "numpy>=2.5.1",
    "pillow>=12.3.0",
    "pycountry==26.2.16",
    "pytubefix>=10.10.1",
    "secretstorage>=3.5.0",
    "torch==2.13.0",
    "torchcodec>=0.15.0",
    "torchvision==0.28.0",
    "transformers>=5.13.1",
    "yt-dlp[default]>=2026.7.4",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
